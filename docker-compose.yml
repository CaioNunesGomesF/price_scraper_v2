services:
  postgres:
    image: postgres:16-alpine
    container_name: price-scraper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: price_scraper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - price_scraper_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d price_scraper"]
      interval: 5s
      timeout: 5s
      retries: 12

  ollama:
    image: ollama/ollama:latest
    container_name: price-scraper-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - price_scraper_ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-init:
    image: ollama/ollama:latest
    container_name: price-scraper-ollama-init
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_MODEL: llama3.2:3b
    volumes:
      - price_scraper_ollama:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until OLLAMA_HOST=http://ollama:11434 ollama list >/dev/null 2>&1; do
          sleep 2
        done
        OLLAMA_HOST=http://ollama:11434 ollama pull $${OLLAMA_MODEL}
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: price-scraper-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 3333
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/price_scraper
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: price-scraper-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: price-scraper-cloudflared
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped

volumes:
  price_scraper_pgdata:
  price_scraper_ollama:
